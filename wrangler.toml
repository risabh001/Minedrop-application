name = "minedrop-application"
main = "worker.js"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Public canonical origin used to construct the Discord OAuth callback URL.
APP_ORIGIN = "https://applications.gamer.dpdns.org"

# Configure these as encrypted Worker secrets in Cloudflare (do not put values here):
# SESSION_SECRET, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN,
# DISCORD_GUILD_ID, DISCORD_WEBHOOK_URL, DISCORD_TICKET_CATEGORY_ID (optional),
# DISCORD_STAFF_ROLE_ID (optional).
# Discord OAuth redirect URL: https://applications.gamer.dpdns.org/api/discord/callback
